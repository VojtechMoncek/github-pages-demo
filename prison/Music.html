<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14212b;--mute:#5d6b77;--line:#d3dae0;--board:#1b2b3a;--lit:#fff;--ok:#3ddc97;--bad:#ff5a5f;--acc:#1f6f8b;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161d;--panel:#16222c;--ink:#e8eef3;--mute:#92a3b1;--line:#2a3a47;--board:#0a1219;--acc:#5bb8d6}}
:root[data-theme="dark"]{--bg:#0e161d;--panel:#16222c;--ink:#e8eef3;--mute:#92a3b1;--line:#2a3a47;--board:#0a1219;--acc:#5bb8d6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;font-weight:800;margin:.2em 0 .5em}
h2{font-size:1.1rem;margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
button{font:inherit;cursor:pointer}
.lvl{text-align:left;padding:14px;border-radius:10px;border:2px solid var(--acc);background:transparent;color:var(--ink)}
.lvl:hover,.lvl:focus-visible{background:var(--acc);color:#fff;outline:none}
.lvl b{display:block;font-size:1.1rem}.lvl span{font-size:.9rem;opacity:.85}
.set label{display:flex;flex-direction:column;font-size:.9rem;gap:4px;max-width:340px}
.set .row{display:flex;gap:8px;align-items:center}
.set input{flex:1;accent-color:var(--acc)}
.set output{min-width:3.6em;text-align:right;font-weight:600}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
#game{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;gap:8px;background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 10px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status{font-weight:600;font-size:1rem;min-width:0}
.btns{display:flex;gap:6px;flex-shrink:0}
#chips{display:flex;gap:6px;flex-wrap:wrap;min-height:0}
#chips i{font-style:normal;font-weight:800;padding:2px 12px;border-radius:99px;border:2px solid var(--line);color:var(--mute)}
#chips i.done{border-color:var(--ok);color:var(--ok)}
#chips i.dot{min-width:2.2em;height:1.7em;padding:0}
#chips i.cur{border-color:var(--acc);color:var(--ink);background:var(--panel)}
.board{position:relative;flex:1;min-height:0;background:var(--board);border-radius:14px;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.pad{--h:0;position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);padding:0;border:0;border-radius:50%;
  background:hsl(var(--h) 55% 38%);color:#fff;font-weight:800;font-size:clamp(.65rem,2.4vmin,1.1rem);
  transition:background .08s,box-shadow .08s}
.pad.on{background:hsl(var(--h) 90% 66%)}
.pad.lit{background:var(--lit);color:#222;box-shadow:0 0 0 4px rgba(255,255,255,.45),0 0 32px 8px rgba(255,255,255,.75)}
.pad.first{outline:3px dashed #fff;outline-offset:4px}
.pad.ok{box-shadow:0 0 0 4px var(--ok)}.pad.bad{box-shadow:0 0 0 5px var(--bad)}
.pad.off{opacity:.18;pointer-events:none}
.pad:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.over{position:absolute;inset:0;background:rgba(10,18,25,.84);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.over h2{font-size:1.6rem;margin:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.pad{transition:none}}
</style>
</head>
<body>
<main>
<section id="menu">
  <h1>Music</h1>
  <div class="panel"><h2>Vyber level</h2><div class="levels" id="levels"></div></div>
  <div class="panel"><h2>Nastavení</h2>
    <div class="set"><label>Tempo ukázky (délka jedné doby)
      <div class="row"><input id="dur" type="range" min="250" max="1000" step="50"><output id="durv"></output></div></label></div>
  </div>
</section>
<section id="game" hidden>
  <div class="bar">
    <div class="status" id="status"></div>
    <div class="btns"><button class="btn" id="listen">▶ Poslouchej</button><button class="btn" id="back">Menu</button></div>
  </div>
  <div id="chips"></div>
  <div class="board" id="board"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nm=m=>NN[m%12]+(Math.floor(m/12)-1);
const midi=s=>{const m=/^([A-G])(#?)(\d)$/.exec(s);return 12*(+m[3]+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0)};
const MAJ=[0,2,4,5,7,9,11,12],MIN=[0,2,3,5,7,8,10,12];

/* ---------- nastavení ---------- */
let dur=520;
try{dur=+localStorage.getItem('music-dur')||dur}catch(e){}
$('dur').value=dur;$('durv').textContent=dur+' ms';
$('dur').oninput=e=>{dur=+e.target.value;$('durv').textContent=dur+' ms';try{localStorage.setItem('music-dur',dur)}catch(x){}};

/* ---------- zvuk ---------- */
let ac=null;
function initAudio(){
  if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A()}
  if(ac.state==='suspended')ac.resume().catch(()=>{});
}
function tone(m,len=.6,vol=.2){
  if(!ac||m==null)return;
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+len);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+len+.02);
}

/* ---------- data ---------- */
const MEL=[
  {n:'Mamma Mia – ABBA (refrén)',
   notes:'E5/.5 D5/.5 E5/.5 D5/1.5 r/1  D5/.5 D5/.5 E5/.5 F#5/1 E5/.5 D5/1  E5/1 D5/1 r/.5 G5/.5 G5/.5 G5/.5  G5/.5 F#5/1 D5/2 r/.5',
   pads:'A4 B4 C#5 D5 E5 F#5 G5 A5 B5'},
  {n:'Old McDonald Had a Farm',
   notes:'C5/1 C5/1 C5/1 G4/1  A4/1 A4/1 G4/2  E5/1 E5/1 D5/1 D5/1  C5/3 G4/1  C5/1 C5/1 C5/1 G4/1  A4/1 A4/1 G4/2  E5/1 E5/1 D5/1 D5/1  C5/3 r/1',
   pads:'F4 G4 A4 B4 C5 D5 E5 F5 G5'}
];
const LEVELS=[
  {n:'Level 1',d:'Náhodná durová nebo mollová stupnice, 8 tónů – každý na jiném tlačítku.',f:L1},
  {n:'Level 2',d:'Akordy C–G–C–F–C a D–G–F–D–G–F. Každý akord rozsvítí 3 náhodná tlačítka.',f:L2},
  {n:'Level 3 – Mamma Mia',d:'Melodie s rytmem – nahoře vidíš správné noty, tlačítka jsou bez popisků.',f:id=>L3(id,0)},
  {n:'Level 3 – Old McDonald',d:'Melodie s rytmem – nahoře vidíš správné noty, tlačítka jsou bez popisků.',f:id=>L3(id,1)}
];
LEVELS.forEach((l,i)=>{
  const b=document.createElement('button');b.className='lvl';
  b.innerHTML=`<b>${l.n}</b><span>${l.d}</span>`;
  b.onclick=()=>start(i);$('levels').append(b);
});

/* ---------- hra: společné ---------- */
let run=0,pads=[],handler=null,busy=0,demoFn=null;
const st=t=>$('status').textContent=t;

function start(i){
  initAudio();const id=++run;busy=0;handler=null;demoFn=null;
  $('menu').hidden=true;$('game').hidden=false;$('chips').innerHTML='';
  LEVELS[i].f(id);$('game').dataset.lvl=i;
}
$('back').onclick=()=>{run++;busy=0;handler=null;$('game').hidden=true;$('menu').hidden=false};
$('listen').onclick=()=>{initAudio();runDemo(run)};

async function runDemo(id){
  if(busy||id!==run||!demoFn)return;
  busy=id;
  try{await demoFn(id)}finally{if(busy===id)busy=0}
}

function layout(n){
  const rc=$('board').getBoundingClientRect(),H=100*Math.max(rc.height,1)/Math.max(rc.width,1);
  let d=Math.sqrt(100*H/n)*0.9,pts;
  for(let t=0;t<60;t++){
    const pad=d*0.4+1;pts=[];let tries=0;
    while(pts.length<n&&tries<3000){
      tries++;
      const p=[pad+Math.random()*(100-2*pad),pad*0.9+Math.random()*(H-1.8*pad)];
      if(pts.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>=d))pts.push(p);
    }
    if(pts.length===n)break;d*=0.94;
  }
  return{pts,H,size:Math.min(d*0.7,11,H*0.18)};
}
function place(){
  const {pts,size,H}=layout(pads.length);
  pads.forEach((e,i)=>{e.style.left=pts[i][0]+'%';e.style.top=(pts[i][1]/H*100)+'%';e.style.width=size+'%'});
}
function mkBoard(){
  const b=$('board');b.innerHTML='';pads=[];
  for(let i=0;i<9;i++){
    const e=document.createElement('button');
    e.className='pad';e.style.setProperty('--h',Math.round((i*137.5)%360));
    e.innerHTML='<span></span>';e.m=null;
    e.onclick=()=>{initAudio();if(handler&&!busy)handler(i)};
    b.append(e);pads.push(e);
  }
  place();
}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!$('game').hidden&&pads.length)place()},150)});
function setPad(i,m,label){pads[i].m=m;pads[i].firstChild.textContent=label||''}
const snd=i=>tone(pads[i].m,.7);
function flash(i,c,ms=350){const p=pads[i];p.classList.add(c);setTimeout(()=>p.classList.remove(c),ms)}
async function hit(i,d,vol){
  tone(pads[i].m,d/1000+.3,vol);
  pads[i].classList.add('lit');await sleep(d);pads[i].classList.remove('lit');
}
function end(id,title,msg){
  if(id!==run)return;handler=null;
  const o=document.createElement('div');o.className='over';
  o.innerHTML=`<h2>${title}</h2><p>${msg}</p>`;
  const a=document.createElement('button');a.className='btn main';a.textContent='Hrát znovu';
  a.onclick=()=>start(+$('game').dataset.lvl);
  const b=document.createElement('button');b.className='btn';b.textContent='Zpět do menu';b.onclick=()=>$('back').click();
  o.append(a,b);$('board').append(o);
}

/* ---------- Level 1: stupnice ---------- */
async function L1(id){
  const root=60+Math.floor(Math.random()*12),minor=Math.random()<.5;
  const iv=minor?MIN:MAJ,name=`${NN[root%12]} ${minor?'moll':'dur'}`;
  const all=shuf([0,1,2,3,4,5,6,7,8]),slots=all.slice(0,8),extra=all[8];
  mkBoard();
  slots.forEach((s,d)=>setPad(s,root+iv[d]));
  setPad(extra,root+12+iv[1]); /* tón nad stupnicí (2. stupeň o oktávu výš) */
  pads[slots[0]].classList.add('first');
  let pos=0,tries=0;
  demoFn=async id=>{
    pos=0;handler=null;st(`${name} – poslouchej`);
    for(const s of slots){if(id!==run)return;await hit(s,dur);await sleep(70)}
    if(id!==run)return;
    st(`${name} – zahraj ji od zvýrazněného tónu`);
    handler=press;
  };
  function press(i){
    snd(i);
    if(i===slots[pos]){
      flash(i,'ok',150);pos++;st(`${name} – ${pos} / 8`);
      if(pos===8)end(id,'Správně!',`Zahrál jsi stupnici ${name}.`+(tries?` Chybných pokusů: ${tries}.`:''));
    }else if(i===slots[0]){flash(i,'ok',150);pos=1;st(`${name} – 1 / 8`)}
    else{flash(i,'bad',500);tries++;pos=0;st('Chyba – začni znovu zvýrazněným tónem')}
  }
  await sleep(400);runDemo(id);
}

/* ---------- Level 2: akordy ---------- */
async function L2(id){
  const SET=[
    {c:'CGF',p:'CGCFC',v:{C:[60,64,67],G:[55,59,62],F:[65,69,72]}},
    {c:'DGF',p:'DGFDGF',v:{D:[62,66,69],G:[67,71,74],F:[53,57,60]}}
  ];
  for(let k=0;k<2;k++){
    const cs=[...SET[k].c],prog=[...SET[k].p];
    const V=SET[k].v,ms=shuf(cs.flatMap(c=>V[c]));
    mkBoard();ms.forEach((m,i)=>setPad(i,m,''));
    const grp={};cs.forEach(c=>grp[c]=V[c].map(m=>ms.indexOf(m)));
    const owner=i=>cs.find(c=>grp[c].includes(i));
    let phase=0,pos=0,cur=null,fin;const got=new Set(),done=new Set();
    const msgs=[`Část ${k+1}/2 · zahraj každý akord jednou (3 tlačítka), pořadí je libovolné`,
                `Část ${k+1}/2 · zahraj celou posloupnost akordů ve správném pořadí`];
    const chips=()=>{$('chips').innerHTML=(phase?prog:cs).map((c,i)=>{
      const d=phase?i<pos:done.has(c);return `<i class="${d?'done':(phase&&i===pos)?'cur':''}">${c}</i>`}).join('')};
    const clear=()=>{got.forEach(j=>pads[j].classList.remove('on'));got.clear();cur=null};
    demoFn=async id=>{
      handler=null;clear();st('Poslouchej: '+prog.join(' – '));
      for(const c of prog){
        if(id!==run)return;
        await Promise.all(grp[c].map(i=>hit(i,dur*1.4,.12)));await sleep(150);
      }
      if(id!==run)return;handler=press;st(msgs[phase]);
    };
    function press(i){
      const c=owner(i);snd(i);
      const need=phase?c===prog[pos]:!done.has(c);
      if(!need||(cur&&cur!==c)){flash(i,'bad',500);clear();st('Špatný akord – zkus znovu');return}
      cur=c;got.add(i);pads[i].classList.add('on');
      if(got.size===3){
        got.forEach(j=>flash(j,'ok'));clear();done.add(c);pos++;chips();
        if(phase?pos===prog.length:done.size===cs.length){handler=null;fin()}
      }
    }
    for(phase=0;phase<2;phase++){
      pos=0;done.clear();clear();chips();st(msgs[phase]);
      await sleep(500);await runDemo(id);if(id!==run)return;
      await new Promise(r=>fin=r);if(id!==run)return;
      st('Hotovo!');await sleep(1000);
    }
  }
  $('chips').innerHTML='';
  end(id,'Zvládnuto!','Zahrál jsi obě posloupnosti akordů.');
}

/* ---------- Level 3: melodie ---------- */
async function L3(id,mi){
  const M=MEL[mi],ladder=M.pads.split(' ').map(midi);
  const ev=M.notes.split(/\s+/).map(t=>{const [n,d]=t.split('/');return{n,d:+d,m:n==='r'?null:midi(n)}});
  const nt=ev.filter(e=>e.m!=null),idx=nt.map(e=>ladder.indexOf(e.m));
  mkBoard();ladder.forEach((m,i)=>setPad(i,m,''));
  let pos=0,miss=0;
  const chips=(now=-1,names=false)=>{$('chips').innerHTML=nt.map((e,i)=>
    `<i class="${names?'':'dot '}${i<pos?'done':i===(now>=0?now:pos)?'cur':''}">${names?e.n:''}</i>`).join('')};
  demoFn=async id=>{
    pos=0;handler=null;st(`${M.n} – poslouchej`);let t=0;
    for(const e of ev){
      if(id!==run)return;
      const len=e.d*dur;
      if(e.m==null){await sleep(len);continue}
      const p=pads[idx[t]];chips(t,true);
      tone(e.m,len/1000*.95+.15);p.classList.add('lit');
      const on=Math.max(80,len*.85);await sleep(on);p.classList.remove('lit');await sleep(len-on);t++;
    }
    if(id!==run)return;
    chips();st(`${M.n} – zahraj melodii (${nt.length} tónů)`);handler=press;
  };
  function press(i){
    snd(i);
    if(i===idx[pos]){
      flash(i,'ok',150);pos++;chips();st(`${M.n} – ${pos} / ${nt.length}`);
      if(pos===nt.length){handler=null;end(id,'Správně!',`Zahrál jsi melodii: ${M.n}.`+(miss?` Chyb: ${miss}.`:''))}
    }else{flash(i,'bad',500);miss++;pos=0;chips();st(`${M.n} – chyba, začni znovu od začátku (0 / ${nt.length})`)}
  }
  chips();await sleep(400);runDemo(id);
}
</script>
</body>
</html>
