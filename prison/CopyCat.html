<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copy Cat</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eef1f4;
  --panel:#fff;
  --ink:#14212b;
  --mute:#5d6b77;
  --line:#d3dae0;
  --board:#1b2b3a;
  --dot:#3b5167;
  --lit:#ffd23f;
  --ok:#3ddc97;
  --bad:#ff5a5f;
  --acc:#1f6f8b;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e161d;
    --panel:#16222c;
    --ink:#e8eef3;
    --mute:#92a3b1;
    --line:#2a3a47;
    --board:#0a1219;
    --dot:#34495c;
    --acc:#5bb8d6
  }
}

:root[data-theme="dark"]{
  --bg:#0e161d;
  --panel:#16222c;
  --ink:#e8eef3;
  --mute:#92a3b1;
  --line:#2a3a47;
  --board:#0a1219;
  --dot:#34495c;
  --acc:#5bb8d6
}

*{
  box-sizing:border-box
}

html{
  scroll-padding-top:env(safe-area-inset-top,0px)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.45
}

main{
  max-width:760px;
  margin:0 auto;
  padding:20px 16px 40px
}

h1{
  font-size:2rem;
  font-weight:800;
  margin:.2em 0 .1em
}

p.sub{
  color:var(--mute);
  margin:0 0 20px
}

h2{
  font-size:1.1rem;
  margin:0 0 10px
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px
}

.levels{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px
}

button{
  font:inherit;
  cursor:pointer
}

.lvl{
  text-align:left;
  padding:14px;
  border-radius:10px;
  border:2px solid var(--acc);
  background:transparent;
  color:var(--ink)
}

.lvl:hover,
.lvl:focus-visible{
  background:var(--acc);
  color:#fff;
  outline:none
}

.lvl b{
  display:block;
  font-size:1.1rem
}

.lvl span{
  font-size:.9rem;
  opacity:.85
}

.set{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:12px 18px
}

.set label{
  display:flex;
  flex-direction:column;
  font-size:.9rem;
  gap:4px
}

.set .row{
  display:flex;
  gap:8px;
  align-items:center
}

.set input[type=range]{
  flex:1;
  accent-color:var(--acc)
}

.set output{
  min-width:3.6em;
  text-align:right;
  font-weight:600
}

.link{
  background:none;
  border:0;
  color:var(--acc);
  text-decoration:underline;
  padding:4px 0
}

.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap
}

.status{
  font-weight:600;
  font-size:1.1rem
}

.btn{
  padding:8px 14px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink)
}

.btn.main{
  background:var(--acc);
  border-color:var(--acc);
  color:#fff
}

#game{
  position:fixed;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:var(--bg);

  padding:
    calc(env(safe-area-inset-top,0px) + 10px)
    calc(env(safe-area-inset-right,0px) + 10px)
    calc(env(safe-area-inset-bottom,0px) + 10px)
    calc(env(safe-area-inset-left,0px) + 10px)
}

#game .bar{
  margin:0;
  flex-wrap:nowrap
}

#game .status{
  font-size:1rem;
  min-width:0
}

.btns{
  display:flex;
  gap:6px;
  flex-shrink:0
}

.board{
  position:relative;
  flex:1;
  min-height:0;
  width:100%;
  background:var(--board);
  border-radius:14px;
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent
}

@media (max-width:480px){
  h1{
    font-size:1.6rem
  }

  #game .status{
    font-size:.9rem
  }

  .btn{
    padding:8px 10px
  }
}

.dot{
  --h:0;

  position:absolute;
  aspect-ratio:1;
  border-radius:50%;
  border:0;

  background:hsl(var(--h) 55% 38%);

  transform:translate(-50%,-50%);

  transition:
    background .08s,
    box-shadow .08s
}

.dot.lit{
  background:hsl(var(--h) 100% 62%);

  box-shadow:
    0 0 0 4px hsl(var(--h) 100% 62%/.35),
    0 0 28px 6px hsl(var(--h) 100% 62%/.6)
}

.dot.ok{
  box-shadow:0 0 0 4px var(--ok)
}

.dot.bad{
  box-shadow:0 0 0 5px var(--bad)
}

.dot:focus-visible{
  outline:3px solid var(--acc);
  outline-offset:3px
}

.board.wait .dot{
  cursor:default
}

.over{
  position:absolute;
  inset:0;

  background:rgba(10,18,25,.82);
  color:#fff;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:10px;
  text-align:center;
  padding:20px
}

.over h2{
  font-size:1.6rem;
  margin:0
}

[hidden]{
  display:none!important
}

#game[hidden]{
  display:none!important
}

@media (prefers-reduced-motion:reduce){
  .dot{
    transition:none
  }
}
</style>
</head>

<body>

<main>

<section id="menu">

  <h1>Copy Cat</h1>

  <div class="panel">
    <h2>Vyber level</h2>
    <div class="levels" id="levels"></div>
  </div>

  <div class="panel">
    <h2>Nastavení</h2>

    <div class="set" id="settings"></div>

    <button class="link" id="reset">
      Obnovit výchozí hodnoty
    </button>
  </div>

</section>


<section id="game" hidden>

  <div class="bar">

    <div class="status" id="status"></div>

    <div class="btns">

      <button class="btn" id="fs" hidden>
        Celá obrazovka
      </button>

      <button class="btn" id="back">
        Menu
      </button>

    </div>

  </div>

  <div class="board" id="board"></div>

</section>

</main>


<script>

/* =========================================================
   NASTAVENÍ
   ========================================================= */

const DEFAULTS={
  dots:9,
  gap:500,
  dur:600,

  l1Start:1,
  l1Len:10,

  l2Start:5,
  l2Len:20,

  l3Start:1,
  l3Len:20
};


const DEFS=[
  ['dots','Počet bodů na obrazovce',3,40,1,''],

  ['gap','Prodleva mezi rozsvícením',100,2000,50,' ms'],

  ['dur','Doba svícení bodu',100,2000,50,' ms'],

  ['l1Start','Level 1: počáteční délka',1,30,1,''],
  ['l1Len','Level 1: cílová délka',1,50,1,''],

  ['l2Start','Level 2: počáteční délka',1,30,1,''],
  ['l2Len','Level 2: cílová délka',1,50,1,''],

  ['l3Start','Level 3: počáteční délka',1,30,1,''],
  ['l3Len','Level 3: cílová délka',1,50,1,'']
];


const LEVELS=[
  {
    k:'l1',
    name:'Level 1',
    desc:'Sekvence roste po jednom bodu.'
  },

  {
    k:'l2',
    name:'Level 2',
    desc:'Delší sekvence, začíná se víc body najednou.'
  },

  {
    k:'l3',
    name:'Level 3',
    desc:'Sekvence se v každém kole úplně změní.'
  }
];


let S={...DEFAULTS};


try{

  const r=localStorage.getItem('copy-cat');

  if(r){
    S={
      ...S,
      ...JSON.parse(r)
    };
  }

}catch(e){}


const save=()=>{
  try{
    localStorage.setItem(
      'copy-cat',
      JSON.stringify(S)
    );
  }catch(e){}
};


const $=id=>document.getElementById(id);

const sleep=ms=>new Promise(
  r=>setTimeout(r,ms)
);


/* =========================================================
   ZVUK
   ========================================================= */

/*
 * AudioContext se vytvoří až po interakci uživatele.
 * Prohlížeče jinak automatické přehrávání zvuku blokují.
 */

let audioContext=null;


/*
 * Každý bod má svůj vlastní tón.
 *
 * Používám pentatonickou stupnici:
 *
 * C D E G A C D E G A ...
 *
 * Tyto tóny jsou od sebe dobře rozeznatelné
 * a zároveň spolu znějí příjemně.
 */

const NOTE_FREQUENCIES=[
  261.63,  // C4 - bod 1
  293.66,  // D4 - bod 2
  329.63,  // E4 - bod 3
  392.00,  // G4 - bod 4
  440.00,  // A4 - bod 5

  523.25,  // C5 - bod 6
  587.33,  // D5 - bod 7
  659.25,  // E5 - bod 8
  783.99,  // G5 - bod 9
  880.00,  // A5 - bod 10

  1046.50, // C6 - bod 11
  1174.66, // D6 - bod 12
  1318.51, // E6 - bod 13
  1567.98, // G6 - bod 14
  1760.00  // A6 - bod 15
];


function initAudio(){

  if(!audioContext){

    const AudioCtx=
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioCtx)return;

    audioContext=new AudioCtx();
  }


  if(audioContext.state==='suspended'){

    audioContext
      .resume()
      .catch(()=>{});

  }

}


/*
 * Přehraje zvuk konkrétního bodu.
 *
 * index 0 = C
 * index 1 = D
 * index 2 = E
 * ...
 *
 * Tón bodu je vždy stejný.
 */

function playDotSound(index){

  if(!audioContext)return;


  if(audioContext.state==='suspended'){

    audioContext
      .resume()
      .catch(()=>{});

  }


  const now=audioContext.currentTime;


  /*
   * Pokud je bodů více než 15,
   * další body pokračují o oktávu výš.
   */

  const noteIndex=
    index % NOTE_FREQUENCIES.length;

  const octave=
    Math.floor(
      index / NOTE_FREQUENCIES.length
    );


  const frequency=
    NOTE_FREQUENCIES[noteIndex] *
    Math.pow(2,octave);


  const oscillator=
    audioContext.createOscillator();

  const gain=
    audioContext.createGain();


  /*
   * Triangle má výraznější charakter
   * než čistý sine tón.
   */

  oscillator.type='triangle';


  oscillator.frequency.setValueAtTime(
    frequency,
    now
  );


  /*
   * Krátký náběh hlasitosti.
   */

  gain.gain.setValueAtTime(
    0,
    now
  );


  gain.gain.linearRampToValueAtTime(
    0.18,
    now+0.015
  );


  /*
   * Postupné zeslabení.
   */

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now+0.32
  );


  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );


  oscillator.start(now);

  oscillator.stop(
    now+0.34
  );
}


/* =========================================================
   MENU
   ========================================================= */

function buildMenu(){

  $('levels').innerHTML='';


  LEVELS.forEach((l,i)=>{

    const b=
      document.createElement('button');

    b.className='lvl';


    b.innerHTML=`
      <b>${l.name}</b>

      <span>
        ${l.desc}<br>
        ${S[l.k+'Start']} → ${S[l.k+'Len']} bodů
      </span>
    `;


    b.onclick=()=>{

      initAudio();

      start(i);

    };


    $('levels').append(b);

  });


  $('settings').innerHTML='';


  DEFS.forEach(
    ([k,label,min,max,step,unit])=>{

      const w=
        document.createElement('label');


      w.innerHTML=`
        ${label}

        <div class="row">

          <input
            type="range"
            min="${min}"
            max="${max}"
            step="${step}"
            value="${S[k]}"
          >

          <output>
            ${S[k]}${unit}
          </output>

        </div>
      `;


      const inp=
        w.querySelector('input');

      const out=
        w.querySelector('output');


      inp.oninput=()=>{

        S[k]=+inp.value;

        out.textContent=
          S[k]+unit;

        save();

        refreshLevelText();

      };


      $('settings').append(w);

    }
  );

}


function refreshLevelText(){

  document
    .querySelectorAll('.lvl')
    .forEach((b,i)=>{

      const k=
        LEVELS[i].k;


      b.querySelector('span').innerHTML=`
        ${LEVELS[i].desc}<br>
        ${S[k+'Start']} → ${S[k+'Len']} bodů
      `;

    });

}


$('reset').onclick=()=>{

  S={...DEFAULTS};

  save();

  buildMenu();

};


/* =========================================================
   ROZMÍSTĚNÍ BODŮ
   ========================================================= */

function layout(n){

  const rc=
    $('board').getBoundingClientRect();


  const H=
    100 *
    Math.max(rc.height,1) /
    Math.max(rc.width,1);


  let d=
    Math.sqrt(100*H/n)*0.95;

  let pts;


  for(let t=0;t<60;t++){

    const pad=
      d*0.4+1;


    pts=[];

    let tries=0;


    while(
      pts.length<n &&
      tries<3000
    ){

      tries++;


      const p=[
        pad+
        Math.random()*
        (100-2*pad),

        pad*0.9+
        Math.random()*
        (H-1.8*pad)
      ];


      if(
        pts.every(q=>
          Math.hypot(
            q[0]-p[0],
            q[1]-p[1]
          )>=d
        )
      ){

        pts.push(p);

      }

    }


    if(pts.length===n){
      break;
    }


    d*=0.94;

  }


  return{

    pts,

    H,

    size:
      Math.min(
        d*0.72,
        13,
        H*0.2
      )

  };

}


/* =========================================================
   HRA
   ========================================================= */

let run=0;

let dots=[];

let clickHandler=null;


function start(i){

  initAudio();


  const id=++run;


  $('menu').hidden=true;

  $('game').hidden=false;


  play(i,id);

}


$('back').onclick=()=>{

  run++;

  clickHandler=null;


  $('game').hidden=true;

  $('menu').hidden=false;


  buildMenu();

};


/* =========================================================
   VYTVOŘENÍ BODŮ
   ========================================================= */

function setupBoard(){

  const b=$('board');


  b.innerHTML='';

  b.classList.add('wait');


  const {
    pts,
    size,
    H
  }=layout(S.dots);


  dots=pts.map((p,i)=>{

    const e=
      document.createElement('button');


    e.className='dot';


    e.style.left=
      p[0]+'%';


    e.style.top=
      (p[1]/H*100)+'%';


    e.style.width=
      size+'%';


    /*
     * Barva každého bodu.
     */

    e.style.setProperty(
      '--h',
      Math.round((i*137.5)%360)
    );


    e.setAttribute(
      'aria-label',
      'Bod '+(i+1)
    );


    /*
     * Kliknutí na bod.
     */

    e.onclick=()=>{

      initAudio();

      if(clickHandler){
        clickHandler(i);
      }

    };


    b.append(e);


    return e;

  });

}


/* =========================================================
   GENEROVÁNÍ SEKQUENCE
   ========================================================= */

const randSeq=n=>{

  const s=[];


  for(let i=0;i<n;i++){

    let x;


    do{

      x=
        Math.floor(
          Math.random()*S.dots
        );

    }while(
      S.dots>1 &&
      x===s[i-1]
    );


    s.push(x);

  }


  return s;

};


/* =========================================================
   UŽIVATELŮV TAH
   ========================================================= */

function waitInput(seq,id){

  return new Promise(res=>{

    let idx=0;


    $('board')
      .classList
      .remove('wait');


    clickHandler=async i=>{

      if(id!==run)return;


      /*
       * Při kliknutí zazní tón konkrétního bodu.
       *
       * Stejný tón zazněl už při jeho rozsvícení.
       */

      playDotSound(i);


      if(i===seq[idx]){

        const e=dots[i];


        e.classList.add('ok');


        setTimeout(()=>{

          e.classList.remove('ok');

        },150);


        idx++;


        $('status').textContent=
          `Tvoje řada: ${idx} / ${seq.length}`;


        if(idx===seq.length){

          clickHandler=null;

          res(true);

        }


      }else{

        clickHandler=null;


        dots[i].classList.add('bad');

        dots[seq[idx]].classList.add('lit');


        res(false);

      }

    };

  });

}


/* =========================================================
   HLAVNÍ HERNÍ SMYČKA
   ========================================================= */

async function play(li,id){

  const k=
    LEVELS[li].k;


  const target=
    Math.max(
      1,
      S[k+'Len']
    );


  let n=
    Math.min(
      S[k+'Start'],
      target
    );


  let seq=[];


  setupBoard();


  await sleep(500);


  while(true){

    if(id!==run)return;


    /*
     * Level 3 dostává v každém kole
     * úplně novou sekvenci.
     */

    if(
      li===2 ||
      seq.length===0
    ){

      seq=randSeq(n);

    }else{

      /*
       * Level 1 a 2 pokračují
       * rozšířením předchozí sekvence.
       */

      while(seq.length<n){

        seq.push(
          randSeq(2).find(
            x =>
              x!==seq[seq.length-1]
          ) ?? 0
        );

      }

    }


    $('status').textContent=
      `${LEVELS[li].name} · kolo ${n} / ${target} · sleduj`;


    $('board')
      .classList
      .add('wait');


    await sleep(400);


    /*
     * Přehrání sekvence.
     */

    for(const i of seq){

      if(id!==run)return;


      /*
       * Rozsvítíme konkrétní bod
       * a současně přehrajeme jeho
       * vlastní tón.
       */

      playDotSound(i);


      dots[i]
        .classList
        .add('lit');


      await sleep(S.dur);


      dots[i]
        .classList
        .remove('lit');


      await sleep(S.gap);

    }


    if(id!==run)return;


    $('status').textContent=
      `${LEVELS[li].name} · kolo ${n} / ${target} · tvůj tah`;


    const ok=
      await waitInput(
        seq,
        id
      );


    if(id!==run)return;


    $('board')
      .classList
      .add('wait');


    if(!ok){

      await sleep(900);


      return end(
        li,
        id,
        false,
        n-1,
        target
      );

    }


    if(n>=target){

      await sleep(300);


      return end(
        li,
        id,
        true,
        n,
        target
      );

    }


    n++;


    await sleep(600);

  }

}


/* =========================================================
   KONEC HRY
   ========================================================= */

function end(
  li,
  id,
  win,
  done,
  target
){

  if(id!==run)return;


  const o=
    document.createElement('div');


  o.className='over';


  o.innerHTML=win

    ?`
      <h2>Zvládnuto!</h2>

      <p>
        Zapamatoval sis celou sekvenci
        (${target} bodů).
      </p>
    `

    :`
      <h2>Chyba</h2>

      <p>
        Bezchybně jsi zvládl sekvenci
        o délce ${Math.max(done,0)} z ${target}.
      </p>
    `;


  const a=
    document.createElement('button');


  a.className='btn main';

  a.textContent='Hrát znovu';


  a.onclick=()=>{

    initAudio();

    start(li);

  };


  const b=
    document.createElement('button');


  b.className='btn';

  b.textContent='Zpět do menu';


  b.onclick=()=>
    $('back').click();


  o.append(a,b);


  $('board').append(o);

}


/* =========================================================
   ZMĚNA VELIKOSTI OKNA
   ========================================================= */

let rt;


addEventListener('resize',()=>{

  clearTimeout(rt);


  rt=setTimeout(()=>{

    if(
      $('game').hidden ||
      !dots.length
    ){
      return;
    }


    const {
      pts,
      size,
      H
    }=layout(dots.length);


    dots.forEach((e,i)=>{

      e.style.left=
        pts[i][0]+'%';


      e.style.top=
        (pts[i][1]/H*100)+'%';


      e.style.width=
        size+'%';

    });

  },150);

});


/* =========================================================
   FULLSCREEN
   ========================================================= */

if(document.fullscreenEnabled){

  $('fs').hidden=false;


  $('fs').onclick=()=>{

    try{

      document.fullscreenElement

        ? document.exitFullscreen()

        : document.documentElement
            .requestFullscreen();

    }catch(e){}

  };

}


/* =========================================================
   START
   ========================================================= */

buildMenu();

</script>

</body>
</html>
