ě<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maps</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#77756e;--bd:#dedbd2;--ok:#1d9a5b;--okbg:#e2f5ea;--ko:#d23f3f;--kobg:#fbe5e5;--ac:#2b5fd9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--tx:#f0efe9;--mut:#9b9a93;--bd:#38383d;--okbg:#17382a;--kobg:#401e1e;--ac:#6f95f5}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--tx:#f0efe9;--mut:#9b9a93;--bd:#38383d;--okbg:#17382a;--kobg:#401e1e;--ac:#6f95f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 16px 40px}
h1{font-size:1.1rem;margin:0 0 14px;color:var(--mut);font-weight:600}
.stats{display:flex;gap:10px;margin-bottom:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:1.25rem}.stat span{font-size:.72rem;color:var(--mut)}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin-bottom:4px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.cap{font-size:.75rem;color:var(--mut);margin-bottom:18px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 18px}
.q h2{margin:0 0 18px;font-size:1.3rem;line-height:1.3}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.opt{padding:12px;background:var(--bg);border:2px solid var(--bd);border-radius:14px;cursor:pointer;transition:transform .1s}
.opt:hover:not(:disabled){transform:scale(1.04);border-color:var(--ac)}
.opt img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--bd)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ko{background:var(--kobg);border-color:var(--ko)}
.opt small{display:block;font-size:.75rem;margin-top:8px;color:var(--mut);font-family:inherit;visibility:hidden}
.opt.ok small,.opt.ko small{visibility:visible;color:var(--tx)}
.fb{min-height:24px;margin-top:16px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.row{display:flex;gap:10px;margin-top:10px}
button.b{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);flex:1}
.done{text-align:center;padding:30px 10px}
</style>
</head>
<body>
<main>
<h1>🌍 Vlajkový kvíz</h1>
<div class="stats">
<div class="stat"><b id="sc">0/0</b><span>správně</span></div>
<div class="stat"><b id="st">0</b><span>série</span></div>
<div class="stat"><b id="ms">0/0</b><span>zvládnuto</span></div>
</div>
<div class="bar"><i id="bar"></i></div>
<div class="cap">Správně zodpovězené otázky se objevují méně často, chybné častěji.</div>
<div class="q" id="box"></div>
<div class="row"><button class="b" id="rs">Resetovat pokrok</button></div>
</main>

["Nejvíce rodilých mluvčích španělštiny – 2024","USA",["USA","Francie","Brazílie"]],
["Nejvíce vítězství na mistrovství světa ve fotbale – 2024","Brazílie",["Německo","Švédsko","Brazílie"]],
["Nejvíce ostrovů","Švédsko",["Švédsko","Rusko","Japonsko"]],
["Nejvyšší HDP na obyvatele – 2020","Austrálie",["Německo","Austrálie","Japonsko"]],
["Nejnižší míra gramotnosti – 1996","Egypt",["USA","Švédsko","Egypt"]],
["Nejvyšší procento populace používající internet – 2024","Rusko",["Indonésie","Rusko"]],
["Nejnižší mediánový věk – 2020","Nigérie",["Brazílie","Nigérie"]],
["Největší letectvo","Čína",["Čína","Egypt","Francie"]],
["Nejvyšší procento populace používající internet – 2024","USA",["USA","Čína","Japonsko"]],
["Nejvíce vězeňských ostrovů","Francie",["Francie","Švédsko","USA"]],
["Nejnižší podíl žen v populaci – 2023","Čína",["Francie","Japonsko","Čína"]],
["Nejvíce uživatelů mobilních telefonů na obyvatele – 2010","Švédsko",["USA","Švédsko"]],
["Největší producent ropy – 2020","USA",["USA","Rusko"]],
["Největší rozloha – 1994","Čína",["Čína","Indie"]],
["Největší počet obyvatel – 2024","Indie",["Indie","Čína","USA"]],
["Nejvyšší procento populace používající internet – 2024","Austrálie",["Německo","Švédsko","Austrálie"]],
["Nejvyšší zaměstnanost mládeže","Indonésie",["Čína","Indonésie","Nigérie"]],
["Nejvyšší střední délka života – 2021","Japonsko",["Francie","Švédsko","Japonsko"]]
];
const KEY="vlajkovy-kviz-v1";
let W=D.map(()=>1),score=0,total=0,streak=0,cur=-1,locked=false;
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.w&&s.w.length===D.length){W=s.w;score=s.score||0;total=s.total||0}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({w:W,score,total}))}catch(e){}};
const $=id=>document.getElementById(id);
const mastered=()=>W.filter(w=>w<0.2).length;
function pick(){
  const idx=D.map((_,i)=>i).filter(i=>i!==cur);
  const sum=idx.reduce((a,i)=>a+W[i],0);
  let r=Math.random()*sum;
  for(const i of idx){r-=W[i];if(r<=0)return i}
  return idx[idx.length-1];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stats(){
  $("sc").textContent=score+"/"+total;$("st").textContent=streak;
  $("ms").textContent=mastered()+"/"+D.length;
  $("bar").style.width=(mastered()/D.length*100)+"%";
}
function render(){
  locked=false;cur=pick();
  const [q,c,o]=D[cur];
  const box=$("box");box.innerHTML="";
  const h=document.createElement("h2");h.textContent=q;box.appendChild(h);
  const g=document.createElement("div");g.className="opts";
  shuffle(o).forEach(n=>{
    const b=document.createElement("button");b.className="opt";b.dataset.n=n;
    const im=document.createElement("img");im.src=F[n];im.alt="Vlajka";im.draggable=false;b.appendChild(im);const sm=document.createElement("small");sm.textContent=n;b.appendChild(sm);
    b.onclick=()=>answer(b,n===c);
    g.appendChild(b);
  });
  box.appendChild(g);
  const fb=document.createElement("div");fb.className="fb";fb.id="fb";box.appendChild(fb);
  stats();
}
function answer(btn,ok){
  if(locked)return;locked=true;total++;
  const c=D[cur][1];
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.n===c)b.classList.add("ok")});
  const fb=$("fb");
  if(ok){score++;streak++;W[cur]=Math.max(0.05,W[cur]*0.35);fb.className="fb ok";fb.textContent="Správně!"}
  else{streak=0;W[cur]=Math.min(3,W[cur]*2+0.5);btn.classList.add("ko");fb.className="fb ko";fb.textContent="Správně je: "+c}
  save();stats();
  const n=document.createElement("button");n.className="b p";n.textContent="Další otázka →";n.onclick=render;
  n.style.marginTop="12px";n.style.width="100%";$("box").appendChild(n);n.focus();
}
$("rs").onclick=()=>{if(confirm("Opravdu smazat pokrok?")){W=D.map(()=>1);score=total=streak=0;save();render()}};
render();
</script>
