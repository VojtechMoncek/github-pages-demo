<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zaškrtni, co patří</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one category per screen, a progress strip on top, a grid of tick tiles, check button at the bottom. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --fg: #16212d;
  --muted: #5b6878;
  --line: #d3dae3;
  --accent: #2563eb;
  --accent-soft: #dbe7fe;
  --good: #15803d;
  --good-soft: #d9f2e1;
  --bad: #c2271d;
  --bad-soft: #fbdcd9;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1722; --surface: #18222f; --fg: #e8eef6; --muted: #98a6b8; --line: #2c3a4b;
    --accent: #6ea0ff; --accent-soft: #1c2f55; --good: #4ade80; --good-soft: #14351f;
    --bad: #ff8178; --bad-soft: #3d1b19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1722; --surface: #18222f; --fg: #e8eef6; --muted: #98a6b8; --line: #2c3a4b;
  --accent: #6ea0ff; --accent-soft: #1c2f55; --good: #4ade80; --good-soft: #14351f;
  --bad: #ff8178; --bad-soft: #3d1b19; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: .02em; color: var(--muted); text-transform: uppercase; }
h2 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 700; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; }
.step { width: 20px; height: 8px; border-radius: 4px; background: var(--line); }
.step.done { background: var(--accent); }
.step.now { background: var(--accent); opacity: .45; }
.hint { color: var(--muted); margin: 0; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.grid.text { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  min-width: 0; padding: 14px 12px; background: var(--surface); color: var(--fg);
  border: 2px solid var(--line); border-radius: 10px; font: inherit; font-weight: 500; text-align: center; cursor: pointer;
}
.tile:hover:not(:disabled) { border-color: var(--accent); }
.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tile:disabled { cursor: default; }
.tile.sel { border-color: var(--accent); background: var(--accent-soft); }
.tile .box {
  position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 6px;
  border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center;
  font-size: 15px; font-weight: 700; line-height: 1; color: #fff;
}
.tile.sel .box { background: var(--accent); border-color: var(--accent); }
.tile.sel .box::after { content: "✓"; }
.grid.text .tile { flex-direction: row; justify-content: flex-start; text-align: left; padding: 14px 44px 14px 14px; min-height: 56px; }
.tile.ok { border-color: var(--good); background: var(--good-soft); }
.tile.ok .box { background: var(--good); border-color: var(--good); }
.tile.ko { border-color: var(--bad); background: var(--bad-soft); }
.tile.ko .box { background: var(--bad); border-color: var(--bad); }
.tile.ko .box::after, .tile.ok.sel .box::after { content: attr(data-mark); }
.tile.ko.sel .box::after { content: "✗"; }
.tile.ok .box::after { content: "✓"; }
.tile.ko:not(.sel) .box::after { content: "✗"; }
.verdict { font-size: .78rem; font-weight: 600; color: var(--muted); }
.tile.ok .verdict { color: var(--good); }
.tile.ko .verdict { color: var(--bad); }
.flag, .avatar { display: block; max-width: 100%; }
.flag { width: 108px; height: 72px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
.avatar { width: 72px; height: 72px; border-radius: 50%; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.score { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; min-height: 1.6em; }
button.main {
  font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 10px; border: 0;
  background: var(--accent); color: #fff; cursor: pointer;
}
:root[data-theme="dark"] button.main { color: #0b1220; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.main { color: #0b1220; } }
button.main:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.result-total { font-family: var(--font-display); font-size: clamp(3rem, 14vw, 5rem); font-weight: 700; line-height: 1; }
.result-total small { font-size: .4em; color: var(--muted); font-weight: 500; }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.row b { font-variant-numeric: tabular-nums; }
.row.full b { color: var(--good); }
.stats { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
summary { cursor: pointer; font-weight: 600; }
.mrows { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px; gap: 10px; align-items: center; font-size: .9rem; }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: block; }
.meter i { display: block; height: 100%; background: var(--accent); }
.mrow b { text-align: right; font-variant-numeric: tabular-nums; }
button.ghost { margin-top: 14px; font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .tile { transition: border-color .12s, background-color .12s; } }
</style>

<script>
function star(cx, cy, R, r, n) {
  var p = [];
  for (var i = 0; i < n * 2; i++) {
    var a = (-90 + i * 180 / n) * Math.PI / 180, d = i % 2 ? r : R;
    p.push((cx + d * Math.cos(a)).toFixed(2) + "," + (cy + d * Math.sin(a)).toFixed(2));
  }
  return p.join(" ");
}
function svg(inner) {
  return '<svg class="flag" viewBox="0 0 90 60" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">' + inner + '</svg>';

function initials(n) { return n.split(" ").map(function (w) { return w[0]; }).join("").slice(0, 2); }
function avatar(name, i) {
  var hues = [212, 160, 20, 280, 340, 45, 190];
  return '<svg class="avatar" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="36" fill="hsl(' + hues[i % hues.length] + ' 42% 36%)"/>' +
    '<text x="36" y="45" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">' + initials(name) + '</text></svg>';
}

    { n: "Guyana", f: "guyana", y: 1 }, { n: "Ghana", f: "ghana", y: 0 }, { n: "Litva", f: "lithuania", y: 0 }, { n: "Libanon", f: "lebanon", y: 0 } ] },
  { title: "Které země patřily do SSSR?", hint: "Zaškrtni vlajky všech zemí, které byly součástí Sovětského svazu.", kind: "flag", items: [
    { n: "Gruzie", f: "georgia", y: 1 }, { n: "Afghánistán", f: "afghanistan", y: 0 }, { n: "Estonsko", f: "estonia", y: 1 }, { n: "Francie", f: "france", y: 0 },
    { n: "Arménie", f: "armenia", y: 1 }, { n: "Moldavsko", f: "moldova", y: 1 }, { n: "Pákistán", f: "pakistan", y: 0 }, { n: "Uzbekistán", f: "uzbekistan", y: 1 } ] }
];

function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

var KEY = "trenink-v1", app = document.getElementById("app"), S;
function load() {
  try { var d = JSON.parse(localStorage.getItem(KEY)); if (d && d.w && d.w.length === CATS.length) return d; } catch (e) {}
  return null;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ w: S.w, rounds: S.rounds, clean: S.clean })); } catch (e) {}
}
function start(reset) {
  var d = (reset ? null : load()) || { w: CATS.map(function () { return 1; }), rounds: 0, clean: 0 };
  S = { w: d.w, rounds: d.rounds, clean: d.clean, cur: -1, sel: {}, checked: false, order: [], open: false, confirmReset: false };
  next();
}
function pick() {
  var w = S.w.map(function (x, k) { return k === S.cur && CATS.length > 1 ? 0 : x; }), tot = 0, i;
  w.forEach(function (x) { tot += x; });
  var r = Math.random() * tot;
  for (i = 0; i < w.length; i++) { r -= w[i]; if (r < 0) return i; }
  return w.length - 1;
}
function next() {
  S.cur = pick(); S.sel = {}; S.checked = false; S.confirmReset = false;
  S.order = shuffle(CATS[S.cur].items.map(function (_, k) { return k; }));
  render();
}
function render() {
  var c = CATS[S.cur];
  var h = '<div class="top"><h1>Trénink</h1><div class="stats">Kol ' + S.rounds + " · bez chyby " + S.clean + "</div></div>";
  h += "<div><h2>" + c.title + '</h2><p class="hint" style="margin-top:8px">' + c.hint + "</p></div>";
  h += '<div class="grid ' + (c.kind === "text" ? "text" : "") + '" id="grid">';
  S.order.forEach(function (k, pos) {
    var it = c.items[k], on = !!S.sel[k], cls = "tile" + (on ? " sel" : ""), verdict = "";
    if (S.checked) {
      cls += on === !!it.y ? " ok" : " ko";
      verdict = '<span class="verdict">' + (it.y ? "patří" : "nepatří") + "</span>";
    }
    var pic = c.kind === "flag" ? FLAGS[it.f]() : c.kind === "person" ? avatar(it.n, pos) : "";
    h += '<button type="button" class="' + cls + '" role="checkbox" aria-checked="' + on + '" data-k="' + k + '" id="t' + k + '" aria-label="' + it.n + '"' + (S.checked ? " disabled" : "") + ">" +
      pic + (c.kind === "flag" ? "" : "<span>" + it.n + "</span>") + verdict + '<span class="box" aria-hidden="true"></span></button>';
  });
  h += "</div>";
  var msg = "";
  if (S.checked) {
    msg = "Správně " + S.last + " z " + c.items.length + (S.last === c.items.length ? " · tohle kolo se bude objevovat méně často" : " · tohle kolo se vrátí častěji");
  }
  h += '<div class="bar"><div class="score" aria-live="polite">' + msg + '</div><button type="button" class="main" id="go">' + (S.checked ? "Další otázka" : "Zkontrolovat") + "</button></div>";
  var sum = S.w.reduce(function (a, b) { return a + b; }, 0), rows = "";
  CATS.forEach(function (cat, k) {
    var p = Math.round(S.w[k] / sum * 100);
    rows += '<div class="mrow"><span>' + cat.title + '</span><span class="meter"><i style="width:' + p + '%"></i></span><b>' + p + " %</b></div>";
  });
  h += '<details id="info"' + (S.open ? " open" : "") + "><summary>Jak často se které kolo objeví</summary><div class=\"mrows\">" + rows + "</div>" +
    '<button type="button" class="ghost" id="reset">' + (S.confirmReset ? "Opravdu vynulovat?" : "Vynulovat pokrok") + "</button></details>";
  app.innerHTML = h;
  document.getElementById("go").onclick = onGo;
  document.getElementById("info").ontoggle = function () { S.open = this.open; };
  document.getElementById("reset").onclick = function () {
    if (!S.confirmReset) { S.confirmReset = true; S.open = true; render(); return; }
    start(true); window.scrollTo(0, 0);
  };
  if (!S.checked) document.getElementById("grid").onclick = function (e) {
    var b = e.target.closest(".tile"); if (!b) return;
    var k = b.getAttribute("data-k"); S.sel[k] = !S.sel[k];
    b.classList.toggle("sel", S.sel[k]); b.setAttribute("aria-checked", S.sel[k]);
  };
}
function onGo() {
  if (!S.checked) {
    var c = CATS[S.cur], pts = 0;
    c.items.forEach(function (it, k) { if (!!S.sel[k] === !!it.y) pts++; });
    var wrong = c.items.length - pts;
    S.last = pts; S.checked = true; S.rounds++;
    if (wrong === 0) { S.clean++; S.w[S.cur] = Math.max(0.25, S.w[S.cur] * 0.5); }
    else { S.w[S.cur] = Math.min(16, S.w[S.cur] * 2 + wrong); }
    save(); render();
    document.getElementById("go").focus();
  } else {
    next(); window.scrollTo(0, 0);
  }
}
start(false);
</script>

</body></html>
